<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>巢藝設計｜預約管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#24211d;--muted:#756f68;--line:#ded8cf;--accent:#5b4a3a;--ok:#2f6e50;--warn:#9a6a21;--danger:#9b3f3f}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#201d1a;color:white;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}.brand{font-weight:700;letter-spacing:.1em}.brand small{display:block;font-weight:400;color:#cbc3bb;letter-spacing:.04em;margin-top:4px}.top-actions{display:flex;gap:8px;align-items:center}.top-actions span{font-size:13px;color:#d9d2cb}
main{max-width:1200px;margin:28px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(44,37,30,.04);padding:24px;margin-bottom:20px}.login{max-width:480px;margin:60px auto}.login h1{margin-top:0}.muted{color:var(--muted);line-height:1.7}label{display:block;font-size:14px;margin:14px 0 7px}input,select{width:100%;padding:12px 13px;border:1px solid #cfc7be;border-radius:10px;background:white;font:inherit;color:var(--ink)}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white}.ghost{background:#eee8e1;color:#4e453d}.danger{background:#f6e9e9;color:var(--danger)}.small{padding:7px 10px;font-size:12px}.full{width:100%;margin-top:16px}.notice{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;background:#edf6f0;color:#275a42}.notice.err{background:#f8eaea;color:#843636}
.toolbar{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:10px;align-items:end;margin-bottom:16px}.toolbar .field label{margin-top:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#f8f6f2;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:26px;margin-top:6px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}th{background:#f8f6f2;color:var(--muted);font-weight:700;position:sticky;top:0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px}.pending{background:#f4ead8;color:#7f5b20}.confirmed{background:#e5f1e9;color:#2f6e50}.cancelled{background:#eee;color:#777}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{margin:0}.block-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.blocked-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.blocked-item{display:flex;align-items:center;gap:8px;background:#f8f6f2;border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 12px;font-size:13px}
.hidden{display:none!important}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.toolbar,.block-grid{grid-template-columns:1fr}.card{padding:18px}.top-actions{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<header>
  <div class="brand">巢藝設計有限公司<small>APPOINTMENT ADMIN</small></div>
  <div class="top-actions"><span id="who"></span><button id="logoutBtn" class="ghost small hidden">登出</button></div>
</header>
<main>
<section id="loginView" class="card login">
  <h1>預約管理後台</h1>
  <p class="muted">輸入管理員 Email，我們會寄一封登入連結到信箱。只有已授權的管理員可以查看客戶預約資料。</p>
  <label for="email">管理員 Email</label>
  <input id="email" type="email" placeholder="name@example.com" autocomplete="email"/>
  <button id="loginBtn" class="primary full">寄送登入連結</button>
  <div id="loginNotice" class="notice"></div>
</section>

<section id="adminView" class="hidden">
  <div class="stats">
    <div class="stat">全部預約<b id="statAll">0</b></div>
    <div class="stat">待確認<b id="statPending">0</b></div>
    <div class="stat">已確認<b id="statConfirmed">0</b></div>
    <div class="stat">已取消<b id="statCancelled">0</b></div>
  </div>

  <div class="card">
    <div class="section-head"><h2>預約列表</h2><button id="refreshBtn" class="ghost">重新整理</button></div>
    <div class="toolbar">
      <div class="field"><label>搜尋客戶 / 電話 / 建案</label><input id="search" placeholder="輸入關鍵字"/></div>
      <div class="field"><label>狀態</label><select id="statusFilter"><option value="all">全部</option><option value="pending">待確認</option><option value="confirmed">已確認</option><option value="cancelled">已取消</option></select></div>
      <div class="field"><label>日期</label><input id="dateFilter" type="date"/></div>
      <button id="clearBtn" class="ghost">清除篩選</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日期</th><th>時段</th><th>服務</th><th>姓名</th><th>電話</th><th>建案名稱</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody id="bookingRows"></tbody>
      </table>
    </div>
    <div id="empty" class="muted hidden" style="padding:20px 4px">目前沒有符合條件的預約。</div>
  </div>

  <div class="card">
    <div class="section-head"><h2>封鎖日期</h2></div>
    <p class="muted">封鎖後，客戶端該日期會顯示不可預約。適合公司休假、內部會議或臨時不接預約的日期。</p>
    <div class="block-grid">
      <div class="field"><label>日期</label><input id="blockDate" type="date"/></div>
      <div class="field"><label>原因（可不填）</label><input id="blockReason" placeholder="例如：公司休假"/></div>
      <button id="blockBtn" class="primary">新增封鎖</button>
    </div>
    <div id="blockedList" class="blocked-list"></div>
  </div>
</section>
</main>
<script>
const SUPABASE_URL='https://fswzgoobhdilyunipowb.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzd3pnb29iaGRpbHl1bmlwb3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjUyNjQsImV4cCI6MjEwNDAwMTI2NH0.ud-lArAq8ChHse5ykIb7sb2xWQWCYnDruT1Q1RZpK2I';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let bookings=[];

function showNotice(el,msg,err=false){el.textContent=msg;el.className='notice'+(err?' err':'');el.style.display='block'}
function statusText(s){return s==='confirmed'?'已確認':s==='cancelled'?'已取消':'待確認'}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(t){return (t||'').slice(0,5)}

$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim().toLowerCase();
  if(!email) return showNotice($('loginNotice'),'請先輸入 Email。',true);
  $('loginBtn').disabled=true;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  $('loginBtn').disabled=false;
  if(error) return showNotice($('loginNotice'),'寄送失敗：'+error.message,true);
  showNotice($('loginNotice'),'登入連結已寄出，請到信箱點擊登入。');
};

$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('refreshBtn').onclick=()=>loadAll();
$('search').oninput=renderBookings;$('statusFilter').onchange=renderBookings;$('dateFilter').onchange=renderBookings;
$('clearBtn').onclick=()=>{$('search').value='';$('statusFilter').value='all';$('dateFilter').value='';renderBookings()};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('loginView').classList.remove('hidden');return}
  $('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('who').textContent=session.user.email||'';
  const {data:ok,error}=await sb.rpc('is_admin');
  if(error||!ok){await sb.auth.signOut();$('adminView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logoutBtn').classList.add('hidden');return showNotice($('loginNotice'),'這個帳號沒有後台權限。',true)}
  loadAll();
}

async function loadAll(){await Promise.all([loadBookings(),loadBlocked()])}
async function loadBookings(){
  const {data,error}=await sb.from('bookings').select('*').order('booking_date',{ascending:true}).order('booking_time',{ascending:true});
  if(error){alert('讀取預約失敗：'+error.message);return}
  bookings=data||[];renderBookings();updateStats();
}
function updateStats(){
  $('statAll').textContent=bookings.length;$('statPending').textContent=bookings.filter(x=>x.status==='pending').length;$('statConfirmed').textContent=bookings.filter(x=>x.status==='confirmed').length;$('statCancelled').textContent=bookings.filter(x=>x.status==='cancelled').length;
}
function renderBookings(){
  const q=$('search').value.trim().toLowerCase(),sf=$('statusFilter').value,df=$('dateFilter').value;
  const rows=bookings.filter(b=>(sf==='all'||b.status===sf)&&(!df||b.booking_date===df)&&(!q||[b.customer_name,b.phone,b.project_name,b.service].some(v=>String(v||'').toLowerCase().includes(q))));
  $('empty').classList.toggle('hidden',rows.length>0);
  $('bookingRows').innerHTML=rows.map(b=>`<tr>
    <td>${esc(b.booking_date)}</td><td>${esc(fmtTime(b.booking_time))}</td><td>${esc(b.service)}</td><td>${esc(b.customer_name)}</td><td>${esc(b.phone)}</td><td>${esc(b.project_name)}</td>
    <td><span class="badge ${esc(b.status)}">${statusText(b.status)}</span></td>
    <td><div class="row-actions">
      ${b.status!=='confirmed'?`<button class="small ghost" onclick="setStatus('${b.id}','confirmed')">確認</button>`:''}
      ${b.status!=='cancelled'?`<button class="small ghost" onclick="setStatus('${b.id}','cancelled')">取消</button>`:''}
      ${b.status!=='pending'?`<button class="small ghost" onclick="setStatus('${b.id}','pending')">改回待確認</button>`:''}
      <button class="small danger" onclick="deleteBooking('${b.id}')">刪除</button>
    </div></td></tr>`).join('');
}
window.setStatus=async(id,status)=>{const {error}=await sb.from('bookings').update({status}).eq('id',id);if(error)return alert('更新失敗：'+error.message);await loadBookings()};
window.deleteBooking=async id=>{if(!confirm('確定要永久刪除這筆預約嗎？'))return;const {error}=await sb.from('bookings').delete().eq('id',id);if(error)return alert('刪除失敗：'+error.message);await loadBookings()};

$('blockBtn').onclick=async()=>{
  const blocked_date=$('blockDate').value,reason=$('blockReason').value.trim();if(!blocked_date)return alert('請先選日期。');
  const {error}=await sb.from('blocked_dates').insert({blocked_date,reason:reason||null});if(error)return alert('新增失敗：'+error.message);
  $('blockDate').value='';$('blockReason').value='';await loadBlocked();
};
async function loadBlocked(){
  const {data,error}=await sb.from('blocked_dates').select('*').order('blocked_date',{ascending:true});if(error){alert('讀取封鎖日期失敗：'+error.message);return}
  $('blockedList').innerHTML=(data||[]).map(x=>`<div class="blocked-item"><span>${esc(x.blocked_date)}${x.reason?'｜'+esc(x.reason):''}</span><button class="small danger" onclick="removeBlock('${x.blocked_date}')">移除</button></div>`).join('')||'<span class="muted">目前沒有封鎖日期。</span>';
}
window.removeBlock=async date=>{if(!confirm('確定移除 '+date+' 的封鎖嗎？'))return;const {error}=await sb.from('blocked_dates').delete().eq('blocked_date',date);if(error)return alert('移除失敗：'+error.message);await loadBlocked()};

sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session) init()});
init();
</script>
</body>
</html>
