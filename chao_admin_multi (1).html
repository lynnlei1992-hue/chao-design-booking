<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>巢藝設計｜預約管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#24211d;--muted:#756f68;--line:#ded8cf;--accent:#5b4a3a;--danger:#9b3f3f}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}header{background:#201d1a;color:#fff;padding:20px 24px;display:flex;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}main{max-width:1250px;margin:28px auto;padding:0 18px}.brand{font-weight:700;letter-spacing:.1em}.brand small{display:block;font-weight:400;color:#cbc3bb;margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(44,37,30,.04)}.login{max-width:480px;margin:60px auto}.muted{color:var(--muted);line-height:1.65}label{display:block;font-size:14px;margin:12px 0 7px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cfc7be;border-radius:10px;background:#fff;font:inherit}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#eee8e1;color:#4e453d}.danger{background:#f6e9e9;color:var(--danger)}.small{padding:7px 10px;font-size:12px}.full{width:100%;margin-top:16px}.hidden{display:none!important}.notice{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;background:#edf6f0;color:#275a42}.notice.err{background:#f8eaea;color:#843636}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#f8f6f2;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:26px;margin-top:6px}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center;margin:0}.checks input{width:auto}.toolbar{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:10px;align-items:end;margin-bottom:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}th{background:#f8f6f2;color:var(--muted)}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.batch-wrap{padding:18px;border:1px solid var(--line);border-radius:14px;background:#faf8f5}.bulk-date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.bulk-date{border:1px solid var(--line);border-radius:10px;padding:10px 6px;background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;min-height:44px}.bulk-date input{width:auto;margin:0}.bulk-date.selected{background:#eee5db;border-color:#9e8974}.bulk-time-list{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}.bulk-time{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}.bulk-time input{width:auto}.bulk-time button{padding:1px 5px;background:transparent;color:var(--danger)}.bulk-setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.batch-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.content-field{border:1px solid var(--line);border-radius:12px;padding:12px;background:#faf8f5}.lead-day-field{background:#f3eee8}.schedule-top,.month-manage{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end}.slot-form{display:grid;grid-template-columns:.7fr 1.4fr .8fr 1.1fr auto;gap:10px;align-items:end;margin-top:16px}.slot-list{display:grid;gap:8px;margin-top:14px}.slot-item{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#faf8f5}.closed{opacity:.6}
@media(max-width:850px){header{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.toolbar,.schedule-top,.month-manage,.slot-form,.bulk-setting-grid{grid-template-columns:1fr}.content-grid{grid-template-columns:1fr}.bulk-date-grid{grid-template-columns:repeat(4,1fr)}.card{padding:18px}}
</style></head>
<body>
<header><div class="brand">巢藝設計有限公司<small>APPOINTMENT ADMIN</small></div><div><span id="who"></span> <button id="logoutBtn" class="ghost small hidden">登出</button></div></header>
<main>
<section id="loginView" class="card login"><h1>預約管理後台</h1><p class="muted">請輸入管理員帳號與密碼登入。</p><label>管理員 Email</label><input id="email" type="email" value="linestudio365@gmail.com"/><label>密碼</label><input id="password" type="password"/><button id="loginBtn" class="primary full">登入後台</button><div id="loginNotice" class="notice"></div></section>
<section id="adminView" class="hidden">
<div class="stats"><div class="stat">全部預約<b id="statAll">0</b></div><div class="stat">待確認<b id="statPending">0</b></div><div class="stat">已確認<b id="statConfirmed">0</b></div><div class="stat">已取消<b id="statCancelled">0</b></div></div>
<div class="card"><div class="section-head"><h2>登入密碼設定</h2></div><div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end"><div><label>新密碼</label><input id="newPassword" type="password"></div><div><label>再次輸入新密碼</label><input id="confirmPassword" type="password"></div><button id="setPasswordBtn" class="primary">設定 / 更新密碼</button></div><div id="passwordNotice" class="notice"></div></div>
<div class="card"><div class="section-head"><h2>網站文字與預約規則</h2></div><div id="siteContentFields" class="content-grid"></div><div style="text-align:right;margin-top:14px"><button id="saveContentBtn" class="primary">儲存設定</button></div><div id="contentNotice" class="notice"></div></div>
<div class="card"><div class="section-head"><h2>預約列表</h2><button id="refreshBtn" class="ghost">重新整理</button></div><div class="toolbar"><div><label>搜尋客戶 / 電話 / 建案 / 地址</label><input id="search"></div><div><label>狀態</label><select id="statusFilter"><option value="all">全部</option><option value="pending">待確認</option><option value="confirmed">已確認</option><option value="cancelled">已取消</option></select></div><div><label>日期</label><input id="dateFilter" type="date"></div><button id="clearBtn" class="ghost">清除篩選</button></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>時段</th><th>服務</th><th>姓名</th><th>電話</th><th>建案</th><th>地址</th><th>狀態</th><th>操作</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div>
<div class="card">
<div class="section-head"><h2>整月批次排程</h2><span class="muted">日期、服務、時間皆可複選；按「套用」會以本次勾選時間覆蓋所選服務原本時段。</span></div>
<div class="batch-wrap">
<div style="max-width:280px"><label>月份</label><input id="bulkMonth" type="month"></div>
<div class="batch-actions"><button id="selectAllDatesBtn" class="ghost small">日期全選</button><button id="selectWeekdaysDatesBtn" class="ghost small">只選一～五</button><button id="clearDatesBtn" class="ghost small">全部取消</button></div>
<div id="bulkDates" class="bulk-date-grid"></div><div id="bulkSelectedCount" class="muted" style="margin-top:8px"></div>
<div class="bulk-setting-grid"><div><label>服務（可複選）</label><div class="checks"><label><input type="checkbox" class="bulkSvc" value="初步諮詢">初步諮詢</label><label><input type="checkbox" class="bulkSvc" value="現場丈量" checked>現場丈量</label><label><input type="checkbox" class="bulkSvc" value="設計會議">設計會議</label></div></div><div><label>時間（可複選）</label><div id="bulkTimes" class="bulk-time-list"></div><div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="bulkNewTime" type="time" step="300"><button id="addBulkTimeBtn" class="ghost">＋加入時間</button></div></div></div>
<div class="batch-actions"><button id="bulkApplyBtn" class="primary">套用所選時間（覆蓋）</button><button id="bulkCloseBtn" class="danger">關閉所選時間</button></div>
<div class="muted" style="margin-top:8px">例：選 9 月平日＋現場丈量，只勾 14:00、16:00 後套用，原本 10:00 的丈量會自動取消。</div>
</div>
<div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line)"><div class="section-head"><h3>單日微調</h3></div><div class="schedule-top"><div><label>管理日期</label><input id="manageDate" type="date"></div><button id="closeDayBtn" class="danger">整天關閉</button><button id="openDayBtn" class="ghost">重新開放</button></div><p id="dayState" class="muted"></p><div class="month-manage"><div><label>整月管理</label><input id="manageMonth" type="month"></div><button id="closeMonthBtn" class="danger">整月關閉</button><button id="openMonthBtn" class="ghost">整月重新開放</button></div><div class="slot-form"><div><label>時間</label><input id="slotTime" type="time" step="300"></div><div><label>開放服務</label><div class="checks"><label><input type="checkbox" class="svc" value="初步諮詢" checked>初步諮詢</label><label><input type="checkbox" class="svc" value="現場丈量" checked>現場丈量</label><label><input type="checkbox" class="svc" value="設計會議" checked>設計會議</label></div></div><div><label>狀態</label><select id="slotOpen"><option value="true">開放</option><option value="false">關閉</option></select></div><div><label>備註</label><input id="slotNote"></div><button id="saveSlotBtn" class="primary">新增 / 更新時段</button></div><div id="slotList" class="slot-list"></div></div>
</div></section></main>
<script>
const SUPABASE_URL='https://fswzgoobhdilyunipowb.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzd3pnb29iaGRpbHl1bmlwb3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjUyNjQsImV4cCI6MjEwNDAwMTI2NH0.ud-lArAq8ChHse5ykIb7sb2xWQWCYnDruT1Q1RZpK2I';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let bookings=[],slots=[],blocked=[],siteContent=[],bulkTimeValues=['10:00','14:00','18:00'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=t=>String(t||'').slice(0,5),ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,services=cls=>[...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value),leadDayKeys=new Set(['booking_min_days_consult','booking_min_days_measure','booking_min_days_meeting']);
function notice(el,msg,err=false){el.textContent=msg;el.className='notice'+(err?' err':'');el.style.display='block'}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error)return notice($('loginNotice'),'登入失敗：'+error.message,true)};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('setPasswordBtn').onclick=async()=>{const p=$('newPassword').value,c=$('confirmPassword').value;if(p.length<8)return notice($('passwordNotice'),'密碼至少 8 個字元。',true);if(p!==c)return notice($('passwordNotice'),'兩次密碼不一致。',true);const {error}=await sb.auth.updateUser({password:p});if(error)return notice($('passwordNotice'),error.message,true);notice($('passwordNotice'),'密碼已更新。')};
async function loadSiteContent(){const {data,error}=await sb.from('site_content').select('*').order('sort_order');if(error)return;siteContent=(data||[]).filter(r=>r.key!=='booking_min_days');$('siteContentFields').innerHTML=siteContent.map(r=>leadDayKeys.has(r.key)?`<div class="content-field lead-day-field"><label>${esc(r.label)}</label><input type="number" min="0" max="90" data-content-key="${esc(r.key)}" value="${esc(r.value)}"><div class="muted">0＝今天可約；14＝最早第 14 天。</div></div>`:`<div class="content-field"><label>${esc(r.label)}</label><textarea data-content-key="${esc(r.key)}">${esc(r.value)}</textarea><label class="checks"><input type="checkbox" data-content-enabled="${esc(r.key)}" ${r.enabled?'checked':''}> 顯示</label></div>`).join('')}
$('saveContentBtn').onclick=async()=>{for(const r of siteContent){const value=(document.querySelector(`[data-content-key="${r.key}"]`)?.value||'').trim(),isLead=leadDayKeys.has(r.key);const args={p_key:r.key,p_value:value,p_enabled:isLead?true:!!document.querySelector(`[data-content-enabled="${r.key}"]`)?.checked,p_font_family:r.font_family||'system',p_font_size:r.font_size||null,p_font_weight:r.font_weight||'400',p_line_height:Number(r.line_height||1.8),p_text_color:r.text_color||'#24211d'};const {error}=await sb.rpc('admin_save_site_content_v2',args);if(error)return notice($('contentNotice'),'儲存失敗：'+error.message,true)}notice($('contentNotice'),'已儲存。')};
async function loadBookings(){const {data,error}=await sb.from('bookings').select('*').order('booking_date').order('booking_time');if(error)return;bookings=data||[];$('statAll').textContent=bookings.length;$('statPending').textContent=bookings.filter(x=>x.status==='pending').length;$('statConfirmed').textContent=bookings.filter(x=>x.status==='confirmed').length;$('statCancelled').textContent=bookings.filter(x=>x.status==='cancelled').length;renderBookings()}
function renderBookings(){const q=$('search').value.toLowerCase(),sf=$('statusFilter').value,df=$('dateFilter').value;const rows=bookings.filter(b=>(sf==='all'||b.status===sf)&&(!df||b.booking_date===df)&&(!q||[b.customer_name,b.phone,b.project_name,b.address,b.service].some(v=>String(v||'').toLowerCase().includes(q))));$('bookingRows').innerHTML=rows.map(b=>`<tr><td>${b.booking_date}</td><td>${fmt(b.booking_time)}</td><td>${esc(b.service)}</td><td>${esc(b.customer_name)}</td><td>${esc(b.phone)}</td><td>${esc(b.project_name)}</td><td>${esc(b.address||'')}</td><td>${esc(b.status)}</td><td><div class="row-actions"><button class="small ghost" onclick="setStatus('${b.id}','confirmed')">確認</button><button class="small ghost" onclick="setStatus('${b.id}','cancelled')">取消</button><button class="small danger" onclick="deleteBooking('${b.id}')">刪除</button></div></td></tr>`).join('')}
window.setStatus=async(id,status)=>{await sb.from('bookings').update({status}).eq('id',id);await loadBookings();await loadDay()};window.deleteBooking=async id=>{if(!confirm('確定刪除？'))return;await sb.from('bookings').delete().eq('id',id);await loadBookings();await loadDay()};
$('search').oninput=renderBookings;$('statusFilter').onchange=renderBookings;$('dateFilter').onchange=renderBookings;$('clearBtn').onclick=()=>{$('search').value='';$('statusFilter').value='all';$('dateFilter').value='';renderBookings()};$('refreshBtn').onclick=()=>loadAll();
async function loadBlocked(){const {data}=await sb.from('blocked_dates').select('*');blocked=data||[];renderDayState()}function renderDayState(){const d=$('manageDate').value;$('dayState').textContent=blocked.some(x=>x.blocked_date===d)?'目前：整天關閉':'目前：依時段設定開放'}
async function loadDay(){const d=$('manageDate').value;if(!d)return;const {data,error}=await sb.rpc('admin_get_slots_v2',{p_start:d,p_end:d});if(error)return alert(error.message);slots=data||[];renderSlots()}
function renderSlots(){$('slotList').innerHTML=slots.length?slots.map(s=>`<div class="slot-item ${s.is_open?'':'closed'}"><strong>${fmt(s.slot_time)}</strong><div>${(s.allowed_services||[]).join('、')}<div class="muted">${s.is_open?'開放':'關閉'}${s.is_booked?'｜已有預約':''}</div></div><div class="row-actions"><button class="small ghost" onclick="editSlot('${fmt(s.slot_time)}')">編輯</button><button class="small danger" onclick="removeSlot('${fmt(s.slot_time)}')">刪除</button></div></div>`).join(''):'<span class="muted">這一天目前沒有設定時段。</span>'}
window.editSlot=time=>{const s=slots.find(x=>fmt(x.slot_time)===time);if(!s)return;$('slotTime').value=time;$('slotOpen').value=String(s.is_open);$('slotNote').value=s.note||'';document.querySelectorAll('.svc').forEach(x=>x.checked=(s.allowed_services||[]).includes(x.value))};window.removeSlot=async time=>{if(!confirm('確定刪除？'))return;const {error}=await sb.rpc('admin_remove_slot_v2',{p_date:$('manageDate').value,p_time:time});if(error)return alert(error.message);await loadDay()};
$('saveSlotBtn').onclick=async()=>{const d=$('manageDate').value,t=$('slotTime').value,sv=services('svc');if(!d||!t||!sv.length)return alert('請完整選擇日期、時間與服務。');const {error}=await sb.rpc('admin_save_slot_v2',{p_date:d,p_time:t,p_open:$('slotOpen').value==='true',p_note:$('slotNote').value.trim()||null,p_allowed_services:sv});if(error)return alert(error.message);await sb.from('blocked_dates').delete().eq('blocked_date',d);await loadDay();await loadBlocked()};
$('closeDayBtn').onclick=async()=>{const d=$('manageDate').value;if(!blocked.some(x=>x.blocked_date===d))await sb.from('blocked_dates').insert({blocked_date:d,reason:'後台整天關閉'});await loadBlocked()};$('openDayBtn').onclick=async()=>{await sb.from('blocked_dates').delete().eq('blocked_date',$('manageDate').value);await loadBlocked()};
function monthBounds(v){if(!v)return null;const [y,m]=v.split('-').map(Number),last=new Date(y,m,0).getDate();return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`,days:last}}
$('closeMonthBtn').onclick=async()=>{const b=monthBounds($('manageMonth').value);if(!b)return;const existing=new Set(blocked.filter(x=>x.blocked_date>=b.start&&x.blocked_date<=b.end).map(x=>x.blocked_date)),rows=[];for(let d=1;d<=b.days;d++){const ds=b.start.slice(0,8)+String(d).padStart(2,'0');if(!existing.has(ds))rows.push({blocked_date:ds,reason:'後台整月關閉'})}if(rows.length)await sb.from('blocked_dates').insert(rows);await loadBlocked()};$('openMonthBtn').onclick=async()=>{const b=monthBounds($('manageMonth').value);if(!b)return;await sb.from('blocked_dates').delete().gte('blocked_date',b.start).lte('blocked_date',b.end);await loadBlocked()};
function selectedBulkDates(){return [...document.querySelectorAll('.bulkDateCheck:checked')].map(x=>x.value)}function updateBulkDateCount(){$('bulkSelectedCount').textContent=`已選 ${selectedBulkDates().length} 天`;document.querySelectorAll('.bulk-date').forEach(x=>x.classList.toggle('selected',!!x.querySelector('input')?.checked))}
function renderBulkDates(){const v=$('bulkMonth').value;if(!v)return;const [y,m]=v.split('-').map(Number),last=new Date(y,m,0).getDate(),names=['日','一','二','三','四','五','六'];$('bulkDates').innerHTML=Array.from({length:last},(_,i)=>{const d=i+1,ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dow=new Date(ds+'T00:00:00').getDay();return `<label class="bulk-date"><input type="checkbox" class="bulkDateCheck" value="${ds}"><span>${d}</span><small>${names[dow]}</small></label>`}).join('');document.querySelectorAll('.bulkDateCheck').forEach(x=>x.onchange=updateBulkDateCount);updateBulkDateCount()}
function renderBulkTimes(){$('bulkTimes').innerHTML=bulkTimeValues.sort().map(t=>`<label class="bulk-time"><input type="checkbox" class="bulkTimeCheck" value="${t}" checked><span>${t}</span><button type="button" data-remove-time="${t}">×</button></label>`).join('');document.querySelectorAll('[data-remove-time]').forEach(b=>b.onclick=e=>{e.preventDefault();bulkTimeValues=bulkTimeValues.filter(t=>t!==b.dataset.removeTime);renderBulkTimes()})}
$('bulkMonth').onchange=renderBulkDates;$('selectAllDatesBtn').onclick=()=>{document.querySelectorAll('.bulkDateCheck').forEach(x=>x.checked=true);updateBulkDateCount()};$('clearDatesBtn').onclick=()=>{document.querySelectorAll('.bulkDateCheck').forEach(x=>x.checked=false);updateBulkDateCount()};$('selectWeekdaysDatesBtn').onclick=()=>{document.querySelectorAll('.bulkDateCheck').forEach(x=>{const d=new Date(x.value+'T00:00:00').getDay();x.checked=d>=1&&d<=5});updateBulkDateCount()};$('addBulkTimeBtn').onclick=()=>{const t=$('bulkNewTime').value;if(t&&!bulkTimeValues.includes(t))bulkTimeValues.push(t);$('bulkNewTime').value='';renderBulkTimes()};
async function replaceServiceSchedule(){const dates=selectedBulkDates(),times=[...document.querySelectorAll('.bulkTimeCheck:checked')].map(x=>x.value),sv=services('bulkSvc');if(!dates.length||!times.length||!sv.length)return alert('日期、服務、時間都至少選一個。');if(!confirm(`將 ${dates.length} 天的「${sv.join('、')}」時段覆蓋成：${times.join('、')}？`))return;$('bulkApplyBtn').disabled=true;try{for(const d of dates){await sb.from('blocked_dates').delete().eq('blocked_date',d);const {data,error}=await sb.rpc('admin_get_slots_v2',{p_start:d,p_end:d});if(error)throw error;const current=data||[],byTime=new Map(current.map(s=>[fmt(s.slot_time),s]));for(const s of current){const t=fmt(s.slot_time),kept=(s.allowed_services||[]).filter(x=>!sv.includes(x));const desired=times.includes(t);const next=[...new Set([...kept,...(desired?sv:[])])];if(!next.length){if(s.is_booked){const {error:e}=await sb.rpc('admin_save_slot_v2',{p_date:d,p_time:t,p_open:false,p_note:s.note||null,p_allowed_services:s.allowed_services||sv});if(e)throw e}else{const {error:e}=await sb.rpc('admin_remove_slot_v2',{p_date:d,p_time:t});if(e)throw e}}else{const {error:e}=await sb.rpc('admin_save_slot_v2',{p_date:d,p_time:t,p_open:desired?true:s.is_open,p_note:s.note||null,p_allowed_services:next});if(e)throw e}}for(const t of times){if(!byTime.has(t)){const {error:e}=await sb.rpc('admin_save_slot_v2',{p_date:d,p_time:t,p_open:true,p_note:null,p_allowed_services:sv});if(e)throw e}}}alert('完成！所選服務時段已依這次勾選內容覆蓋，舊時間已同步取消。');await loadDay();await loadBlocked()}catch(e){alert('套用失敗：'+e.message)}finally{$('bulkApplyBtn').disabled=false}}
async function closeSelectedTimes(){const dates=selectedBulkDates(),times=[...document.querySelectorAll('.bulkTimeCheck:checked')].map(x=>x.value),sv=services('bulkSvc');if(!dates.length||!times.length||!sv.length)return alert('日期、服務、時間都至少選一個。');if(!confirm('確定關閉所選服務的所選時間？'))return;for(const d of dates){const {data}=await sb.rpc('admin_get_slots_v2',{p_start:d,p_end:d});for(const s of data||[]){const t=fmt(s.slot_time);if(!times.includes(t))continue;const next=(s.allowed_services||[]).filter(x=>!sv.includes(x));if(next.length)await sb.rpc('admin_save_slot_v2',{p_date:d,p_time:t,p_open:s.is_open,p_note:s.note||null,p_allowed_services:next});else if(s.is_booked)await sb.rpc('admin_save_slot_v2',{p_date:d,p_time:t,p_open:false,p_note:s.note||null,p_allowed_services:s.allowed_services||sv});else await sb.rpc('admin_remove_slot_v2',{p_date:d,p_time:t})}}alert('已關閉所選時段。');await loadDay()}
$('bulkApplyBtn').onclick=replaceServiceSchedule;$('bulkCloseBtn').onclick=closeSelectedTimes;
async function loadAll(){await Promise.all([loadBookings(),loadBlocked(),loadSiteContent(),loadDay()])}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return;$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('who').textContent=session.user.email||'';const {data:ok}=await sb.rpc('is_admin');if(!ok){await sb.auth.signOut();return location.reload()}const today=ymd(new Date());$('manageDate').value=today;$('manageMonth').value=today.slice(0,7);$('bulkMonth').value=today.slice(0,7);renderBulkDates();renderBulkTimes();await loadAll()}
$('manageDate').onchange=()=>{loadDay();renderDayState()};sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s)setTimeout(init,0)});init();
</script></body></html>
