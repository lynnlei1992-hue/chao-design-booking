<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>巢藝設計｜預約表單欄位設定</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#24211d;--muted:#756f68;--line:#ded8cf;--accent:#5b4a3a;--danger:#9b3f3f}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}header{background:#201d1a;color:#fff;padding:20px 24px}.brand{font-weight:700;letter-spacing:.1em}.brand small{display:block;font-weight:400;color:#cbc3bb;margin-top:4px}main{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.login{max-width:480px;margin:60px auto}.hidden{display:none!important}.muted{color:var(--muted);line-height:1.65}label{display:block;font-size:14px;margin:12px 0 7px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cfc7be;border-radius:10px;background:#fff;font:inherit}textarea{min-height:85px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#eee8e1;color:#4e453d}.danger{background:#f6e9e9;color:var(--danger)}.full{width:100%;margin-top:16px}.notice{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;background:#edf6f0;color:#275a42}.notice.err{background:#f8eaea;color:#843636}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:6px;margin:4px 0}.checks input{width:auto}.field-list{display:grid;gap:10px;margin-top:16px}.item{border:1px solid var(--line);border-radius:14px;padding:16px;background:#faf8f5;display:grid;grid-template-columns:1fr auto;gap:12px}.item.off{opacity:.58}.meta{font-size:13px;color:var(--muted);line-height:1.7}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:start}.answer-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#faf8f5}.answer-row{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}.answer-row:last-child{border:0}@media(max-width:700px){.grid,.item,.answer-row{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.actions button{flex:1}}
</style></head><body>
<header><div class="brand">巢藝設計有限公司<small>FORM FIELD ADMIN</small></div></header><main>
<section id="loginView" class="card login"><h1>預約表單欄位設定</h1><p class="muted">使用與原預約後台相同的管理員帳號密碼。</p><label>Email</label><input id="email" type="email" value="linestudio365@gmail.com"><label>密碼</label><input id="password" type="password"><button id="loginBtn" class="primary full">登入</button><div id="loginNotice" class="notice"></div></section>
<section id="adminView" class="hidden">
<div class="card"><div class="head"><div><h2 style="margin:0">自訂預約欄位</h2><div class="muted">初步諮詢、現場丈量、設計會議都可以各自設定，也可以同一欄位套用多種服務。</div></div><div><button id="backBtn" class="ghost">回原預約後台</button> <button id="logoutBtn" class="ghost">登出</button></div></div></div>
<div class="card"><h2 id="formTitle">新增欄位</h2><input id="editId" type="hidden">
<div class="grid"><div><label>欄位名稱 *</label><input id="label" placeholder="例如：室內坪數"></div><div><label>欄位類型</label><select id="type"><option value="text">一般文字</option><option value="textarea">多行文字</option><option value="select">下拉選單</option><option value="radio">單選</option><option value="checkbox">複選</option></select></div><div><label>輸入提示</label><input id="placeholder" placeholder="例如：請輸入室內坪數"></div><div><label>排序</label><input id="sort" type="number" value="100"></div></div>
<label>欄位說明／備註</label><textarea id="help" placeholder="顯示在客戶填寫欄位下方，可留空"></textarea>
<div id="optionsWrap" class="hidden"><label>選項內容</label><textarea id="options" placeholder="每行一個選項，例如：&#10;新成屋&#10;中古屋&#10;預售屋"></textarea><div class="muted">下拉、單選、複選才需要填；每一行代表一個選項。</div></div>
<label>套用服務 *</label><div class="checks"><label><input type="checkbox" class="svc" value="初步諮詢" checked> 初步諮詢</label><label><input type="checkbox" class="svc" value="現場丈量" checked> 現場丈量</label><label><input type="checkbox" class="svc" value="設計會議" checked> 設計會議</label></div>
<div class="checks"><label><input id="required" type="checkbox"> 必填</label><label><input id="enabled" type="checkbox" checked> 顯示／啟用</label></div>
<div style="display:flex;gap:8px;margin-top:16px"><button id="saveBtn" class="primary">儲存欄位</button><button id="cancelBtn" class="ghost hidden">取消編輯</button></div><div id="formNotice" class="notice"></div></div>
<div class="card"><div class="head"><h2 style="margin:0">目前欄位</h2><button id="refreshBtn" class="ghost">重新整理</button></div><div id="fieldList" class="field-list"></div></div>
<div class="card"><div class="head"><div><h2 style="margin:0">客戶自訂欄位回答</h2><div class="muted">只顯示有填寫自訂欄位的預約。</div></div><button id="refreshAnswersBtn" class="ghost">重新整理</button></div><div id="answers"></div></div>
</section></main>
<script>
const U='https://fswzgoobhdilyunipowb.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzd3pnb29iaGRpbHl1bmlwb3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjUyNjQsImV4cCI6MjEwNDAwMTI2NH0.ud-lArAq8ChHse5ykIb7sb2xWQWCYnDruT1Q1RZpK2I',sb=window.supabase.createClient(U,K),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let fields=[],bookings=[],answers=[];
function notice(el,msg,err=false){el.textContent=msg;el.className='notice'+(err?' err':'');el.style.display='block'}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return notice($('loginNotice'),'登入失敗：'+error.message,true)};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('backBtn').onclick=()=>location.href='admin.html';$('type').onchange=()=>$('optionsWrap').classList.toggle('hidden',!['select','radio','checkbox'].includes($('type').value));
function reset(){ $('editId').value='';$('formTitle').textContent='新增欄位';$('label').value='';$('type').value='text';$('placeholder').value='';$('help').value='';$('options').value='';$('sort').value='100';$('required').checked=false;$('enabled').checked=true;document.querySelectorAll('.svc').forEach(x=>x.checked=true);$('optionsWrap').classList.add('hidden');$('cancelBtn').classList.add('hidden')}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data:ok,error}=await sb.rpc('is_admin');if(error||!ok){await sb.auth.signOut();return location.reload()}$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');await Promise.all([loadFields(),loadAnswers()])}
async function loadFields(){const {data,error}=await sb.from('booking_form_fields').select('*').order('sort_order').order('created_at');if(error)return alert('讀取欄位失敗：'+error.message);fields=data||[];renderFields()}
function renderFields(){const names={text:'一般文字',textarea:'多行文字',select:'下拉選單',radio:'單選',checkbox:'複選'};$('fieldList').innerHTML=fields.length?fields.map(f=>`<div class="item ${f.enabled?'':'off'}"><div><strong>${esc(f.label)}${f.required?' *':''}</strong><div class="meta">${names[f.field_type]||f.field_type}｜${(f.services||[]).map(esc).join('、')}｜排序 ${f.sort_order}｜${f.enabled?'顯示中':'已關閉'}${Array.isArray(f.options)&&f.options.length?'｜選項：'+f.options.map(esc).join('、'):''}</div>${f.help_text?`<div class="meta">說明：${esc(f.help_text)}</div>`:''}</div><div class="actions"><button class="ghost" onclick="editField('${f.id}')">編輯</button><button class="danger" onclick="delField('${f.id}')">刪除</button></div></div>`).join(''):'<div class="muted">目前沒有自訂欄位。按上方新增即可。</div>'}
window.editField=id=>{const f=fields.find(x=>x.id===id);if(!f)return;$('editId').value=f.id;$('formTitle').textContent='編輯欄位';$('label').value=f.label;$('type').value=f.field_type;$('placeholder').value=f.placeholder||'';$('help').value=f.help_text||'';$('options').value=(f.options||[]).join('\n');$('sort').value=f.sort_order;$('required').checked=f.required;$('enabled').checked=f.enabled;document.querySelectorAll('.svc').forEach(x=>x.checked=(f.services||[]).includes(x.value));$('optionsWrap').classList.toggle('hidden',!['select','radio','checkbox'].includes(f.field_type));$('cancelBtn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
window.delField=async id=>{if(!confirm('確定刪除這個欄位嗎？已完成預約的歷史回答會保留欄位名稱。'))return;const {error}=await sb.from('booking_form_fields').delete().eq('id',id);if(error)return alert('刪除失敗：'+error.message);await loadFields()};
$('cancelBtn').onclick=reset;$('refreshBtn').onclick=loadFields;
$('saveBtn').onclick=async()=>{const label=$('label').value.trim(),services=[...document.querySelectorAll('.svc:checked')].map(x=>x.value),type=$('type').value;if(!label)return notice($('formNotice'),'請輸入欄位名稱。',true);if(!services.length)return notice($('formNotice'),'至少選一種服務。',true);const options=['select','radio','checkbox'].includes(type)?$('options').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[];if(['select','radio','checkbox'].includes(type)&&!options.length)return notice($('formNotice'),'這個欄位類型至少需要一個選項。',true);const row={label,field_type:type,placeholder:$('placeholder').value.trim(),help_text:$('help').value.trim(),required:$('required').checked,enabled:$('enabled').checked,services,options,sort_order:Number($('sort').value||100),updated_at:new Date().toISOString()},id=$('editId').value;let error;if(id)({error}=await sb.from('booking_form_fields').update(row).eq('id',id));else({error}=await sb.from('booking_form_fields').insert(row));if(error)return notice($('formNotice'),'儲存失敗：'+error.message,true);notice($('formNotice'),'已儲存。');reset();await loadFields()};
function valText(v){if(Array.isArray(v))return v.join('、');if(v===null||v===undefined)return '';return String(v)}
async function loadAnswers(){const [{data:b,error:be},{data:a,error:ae}]=await Promise.all([sb.from('bookings').select('*').order('booking_date',{ascending:false}),sb.rpc('admin_get_booking_answers_v1')]);if(be||ae)return $('answers').innerHTML='<div class="muted">回答資料尚未啟用，請先完成資料庫更新。</div>';bookings=b||[];answers=a||[];const by={};for(const a of answers)(by[a.booking_uid]??=[]).push(a);const rows=bookings.filter(b=>by[b.booking_uid]?.length);$('answers').innerHTML=rows.length?rows.map(b=>`<div class="answer-card"><strong>${esc(b.booking_date)} ${esc(String(b.booking_time).slice(0,5))}｜${esc(b.service)}｜${esc(b.customer_name)}</strong>${by[b.booking_uid].map(a=>`<div class="answer-row"><b>${esc(a.field_label)}</b><span>${esc(valText(a.value))}</span></div>`).join('')}</div>`).join(''):'<div class="muted">目前還沒有自訂欄位回答。</div>'}
$('refreshAnswersBtn').onclick=loadAnswers;sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s)init()});init();
</script></body></html>
